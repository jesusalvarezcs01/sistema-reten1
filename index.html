<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SISTEMA EL RETÉN V29 - FINAL FIX</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@microblink/blinkid-in-browser-sdk@5.16.0/ui/dist/blinkid-in-browser/blinkid-in-browser.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">

    <style>
        :root { --p: #0f172a; --bg: #f8fafc; --accent: #0ea5e9; }
        body { font-family: -apple-system, sans-serif; background: var(--bg); margin: 0; color: #1e293b; overflow-x: hidden; }
        .view { display: none; padding: 20px; min-height: 100vh; flex-direction: column; box-sizing: border-box; }
        .active { display: flex; }
        .card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); width: 100%; max-width: 350px; margin: auto; text-align: center; }
        input { width: 100%; padding: 14px; margin: 10px 0; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 16px; outline: none; }
        .btn { background: var(--p); color: white; padding: 16px; border: none; border-radius: 8px; font-weight: bold; width: 100%; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 15px; }
        header { background: var(--p); color: white; padding: 15px; display: flex; justify-content: space-between; align-items: center; }
        .scanner-viewport { background: #000; border-radius: 15px; overflow: hidden; height: 450px; margin-top: 15px; position: relative; border: 2px solid #e2e8f0; display: flex; align-items: center; justify-content: center; }
        blinkid-in-browser { width: 100%; height: 100%; display: block; }
        #loading-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #000; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 10; padding: 20px; text-align: center; box-sizing: border-box; }
        .progress-circle { position: relative; width: 100px; height: 100px; margin-bottom: 20px; }
        .progress-circle svg { transform: rotate(-90deg); width: 100px; height: 100px; }
        .progress-circle circle { fill: none; stroke-width: 6; stroke-linecap: round; }
        .progress-circle .bg { stroke: #1e293b; }
        .progress-circle .bar { stroke: var(--accent); stroke-dasharray: 282.7; stroke-dashoffset: 282.7; transition: stroke-dashoffset 0.3s; }
        .progress-text { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: white; font-weight: bold; font-size: 18px; }
        .diag-msg { background: #450a0a; color: #fecaca; padding: 12px; border-radius: 8px; font-size: 12px; margin-top: 20px; display: none; text-align: left; border: 1px solid #e11d48; }
    </style>
</head>
<body>

    <!-- VISTA 1: LOGIN -->
    <div id="view-login" class="view active">
        <div class="card">
            <h2 style="margin:0">Acceso</h2>
            <p style="color: #64748b; font-size: 14px;">Laboratorio El Retén</p>
            <input type="text" id="user" placeholder="Usuario">
            <input type="password" id="pass" placeholder="Contraseña">
            <button class="btn" onclick="iniciarSesion()">ENTRAR</button>
        </div>
    </div>

    <!-- VISTA 2: ESCÁNER -->
    <div id="view-main" class="view">
        <header>
            <b>REGISTRO ELECTORAL</b>
            <i class="fas fa-redo" onclick="location.reload()" style="cursor:pointer"></i>
        </header>
        
        <div class="scanner-viewport">
            <div id="loading-overlay">
                <div class="progress-circle">
                    <svg><circle class="bg" cx="50" cy="50" r="45"></circle><circle id="progress-bar" class="bar" cx="50" cy="50" r="45"></circle></svg>
                    <div class="progress-text" id="percent">0%</div>
                </div>
                <p style="color:white; font-size:14px;" id="loading-task">Inicializando...</p>
                <div id="diag-msg" class="diag-msg"></div>
            </div>
            <blinkid-in-browser id="scanner-element"></blinkid-in-browser>
        </div>

        <button class="btn" style="background:white; color:var(--p); border:1px solid #cbd5e1; margin-top:20px;" onclick="verHistorial()">
            <i class="fas fa-database"></i> VER REGISTROS
        </button>
    </div>

    <!-- VISTA 3: HISTORIAL -->
    <div id="view-history" class="view">
        <header>
            <i class="fas fa-arrow-left" onclick="volverEscaner()"></i>
            <b>HISTORIAL</b>
            <span></span>
        </header>
        <div id="lista-datos" style="margin-top:20px;"></div>
    </div>

    <script>
        const fbConfig = {
            apiKey: "AIzaSyBts_xdg7d8mVqu_97FDyxnhL7vQPyf4Hk",
            authDomain: "test-escaneo-reten.firebaseapp.com",
            projectId: "test-escaneo-reten",
            storageBucket: "test-escaneo-reten.firebasestorage.app",
            messagingSenderId: "621980990940",
            appId: "1:621980990940:web:46f49905050c2ea7dde319"
        };
        firebase.initializeApp(fbConfig);
        const db = firebase.firestore();

        function iniciarSesion() {
            if(document.getElementById('user').value === 'admin' && document.getElementById('pass').value === 'admin2026') {
                document.getElementById('view-login').style.display = 'none';
                document.getElementById('view-main').classList.add('active');
                activarMicroblink();
            } else { alert("Acceso denegado"); }
        }

        function updateProgress(percent, task) {
            const bar = document.getElementById('progress-bar');
            const txt = document.getElementById('percent');
            const taskTxt = document.getElementById('loading-task');
            const circum = 2 * Math.PI * 45;
            bar.style.strokeDashoffset = circum - (percent / 100 * circum);
            txt.innerText = Math.round(percent) + "%";
            if(task) taskTxt.innerText = task;
        }

        function activarMicroblink() {
            const el = document.getElementById('scanner-element');
            const diag = document.getElementById('diag-msg');
            
            // Verificación inmediata de cabeceras
            if (!window.crossOriginIsolated) {
                diag.style.display = "block";
                diag.innerHTML = "<b>BLOQUEO DE SEGURIDAD:</b> Netlify no está enviando las cabeceras correctas. Asegúrate de que el archivo <u>netlify.toml</u> NO tenga barras invertidas antes de los corchetes.";
            }

            el.licenseKey = "sRwCABpjaXZpZXMtZWxyZXRlbi5uZXRsaWZ5LmFwcAZsZXlKRGNtVmhkR1ZrVDI0aU9qRTNOekEwTVRBeU9UZ3hNREVzSWtOeVpXRjBaV1JHYjNJaU9pSXhNalV5TXpOak1pMDBZVEJoTFRSaFlXUXRZakZpTUMwek16WmtOVGt5WWprNVltSWlmUT092SU00NPl1EE7Or7AQ/+k8AH7fKyoRNnt7LKBap1KCLGHkVDw6lbzEisHiHyujB58cu6n6X8VcsBzHI6FRVVECQAh764cagB9G0W7T/3x1UrwXEdGY2LghcD3VjyNYA==";
            el.recognizers = ['BlinkIdRecognizer'];
            el.engineLocation = "https://cdn.jsdelivr.net/npm/@microblink/blinkid-in-browser-sdk@5.16.0/resources/";

            let p = 0;
            const t = setInterval(() => {
                if(p < 90) { p += 5; updateProgress(p, "Cargando Motor IA..."); }
                else { clearInterval(t); }
            }, 200);

            el.addEventListener('ready', () => {
                updateProgress(100, "¡Listo!");
                setTimeout(() => document.getElementById('loading-overlay').style.display = 'none', 500);
            });

            el.addEventListener('scanSuccess', async (ev) => {
                const results = ev.detail.recognizers.BlinkIdRecognizer;
                if (results.resultState === 'Valid') {
                    const doc = results.documentNumber || results.mrz.documentNumber || results.barcode.data;
                    const nom = results.fullName || "Escaneado";
                    await db.collection("registros_dia_d").add({
                        cedula: doc, nombre: nom, fecha: new Date().toLocaleString()
                    });
                    alert("Cédula Registrada: " + doc);
                }
            });
        }

        async function cargarDatos() {
            const list = document.getElementById('lista-datos');
            list.innerHTML = 'Cargando...';
            const snapshot = await db.collection("registros_dia_d").orderBy("fecha", "desc").limit(20).get();
            list.innerHTML = '';
            snapshot.forEach(doc => {
                const d = doc.data();
                list.innerHTML += `<div style="background:white; padding:15px; margin-bottom:10px; border-radius:8px; border-left:4px solid var(--p);"><b>${d.nombre}</b><br><small>C.C. ${d.cedula}</small></div>`;
            });
        }

        function verHistorial() {
            document.getElementById('view-main').classList.remove('active');
            document.getElementById('view-history').classList.add('active');
            cargarDatos();
        }

        function volverEscaner() {
            document.getElementById('view-history').classList.remove('active');
            document.getElementById('view-main').classList.add('active');
        }
    </script>
</body>
</html>
